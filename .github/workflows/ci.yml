name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f
        with:
          version: "1.243.0"
      - run: clojure -M:test
      - run: clojure -M:lint
      - run: clojure -M:cli fleet-gate
      - run: bash deploy/validate-packaging.sh
      - run: bash deploy/staging-smoke.sh

